# 定时任务配置

# 天气早报 (每天 8:00)
morning_report:
  enabled: true
  time: "0 8 * * *"
  script: scripts/morning_report.sh

# 每3小时复盘
hourly_review:
  enabled: true
  time: "0 */3 * * *"
  script: scripts/hourly_review.sh

# 晚间总结 (每天 22:00)
evening_review:
  enabled: true
  time: "0 22 * * *"
  script: scripts/evening_review.sh

# 每周复盘 (周日 20:00)
weekly_review:
  enabled: true
  time: "0 20 * * 0"
  script: scripts/weekly_review.sh
